name = "satoshi-shelf"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Static storefront served from the same origin as the download API.
# Built by `node tools/build_site.mjs` into /dist.
[assets]
directory = "../dist"

[vars]
BTC_ADDRESS = "bc1qrs6leywqgu56d8h5ynw9ynn0e3kdduantgd2z3"
STORE_URL = "https://satoshi-shelf.xghabra.workers.dev/"

# Optional hardening:
#   wrangler secret put DOWNLOAD_SECRET   # download-link signing key
#   wrangler secret put SHELF_KEY         # deliverable decryption key
# If not set, the worker falls back to the private key in the build bundle,
# so a plain `wrangler deploy` works with zero configuration.
