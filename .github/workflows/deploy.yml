name: Deploy site to GitHub Pages

# Publishes ONLY the public storefront files. Source, notes, tools and the
# worker are never uploaded, so nothing internal is ever web-reachable.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the public site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html product.html launcher.html 404.html custom.html _site/
          cp robots.txt sitemap.xml _site/
          cp google64746a467932f1b1.html _site/
          touch _site/.nojekyll
          cp -r assets _site/assets
          cp -r previews _site/previews
          echo "published files:" && find _site -type f | wc -l

      - name: Verify nothing private slipped in
        run: |
          set -euo pipefail
          for bad in products secure worker tools __marketing_src __README.md dist .git; do
            if [ -e "_site/$bad" ]; then
              echo "::error::refusing to publish private path: $bad"
              exit 1
            fi
          done
          if find _site -name "*.shelfkey" -o -name "embedded.js" | grep -q .; then
            echo "::error::refusing to publish secret material"
            exit 1
          fi
          echo "leak check passed"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
